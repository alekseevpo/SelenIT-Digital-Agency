<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#ffffff" rx="4" />
  
  <!-- S -->
  <text x="4" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1e293b">
    S
  </text>
  
  <!-- .IT -->
  <text x="12" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="url(#redGradient)">
    .IT
  </text>
  
  <!-- Red underline -->
  <rect x="4" y="26" width="18" height="2" fill="url(#redGradient)" rx="1" />
</svg>
