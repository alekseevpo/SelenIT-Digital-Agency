  <!-- .IT -->
  <text x="78" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="url(#redGradient)">
    .IT
  </text>
  
  <!-- Agency -->
  <text x="130" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#64748b">
