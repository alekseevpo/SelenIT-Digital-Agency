<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #000000 0%, #1e293b 50%, #334155 100%);
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .decorative-circle {
            position: absolute;
            border-radius: 50%;
        }
        
        .circle1 {
            top: 50px;
            left: 50px;
            width: 160px;
            height: 160px;
            background: rgba(220, 38, 38, 0.1);
        }
        
        .circle2 {
            bottom: 50px;
            right: 50px;
            width: 200px;
            height: 200px;
            background: rgba(239, 68, 68, 0.1);
        }
        
        .circle3 {
            top: 150px;
            right: 100px;
            width: 120px;
            height: 120px;
            background: rgba(220, 38, 38, 0.05);
        }
        
        .circle4 {
            bottom: 150px;
            left: 100px;
            width: 140px;
            height: 140px;
            background: rgba(239, 68, 68, 0.05);
        }
        
        .content {
            position: relative;
            z-index: 10;
            padding: 60px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            filter: drop-shadow(0 4px 8px rgba(220, 38, 38, 0.3));
        }
        
        .logo-selen {
            font-size: 72px;
            font-weight: 900;
            color: #ffffff;
        }
        
        .logo-it {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(90deg, #dc2626, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo-underline {
            width: 340px;
            height: 4px;
            background: linear-gradient(90deg, #dc2626, #ef4444);
            border-radius: 2px;
            margin-bottom: 60px;
        }
        
        .title {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 30px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        
        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        
        .description {
            font-size: 20px;
            font-weight: 300;
            color: #64748b;
            margin-bottom: 40px;
        }
        
        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 50px;
            background: linear-gradient(90deg, #dc2626, #ef4444);
            border-radius: 25px;
            margin-bottom: 40px;
        }
        
        .cta-text {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .decorative-lines {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .line {
            height: 2px;
            background: linear-gradient(90deg, #dc2626, #ef4444);
        }
        
        .line1 {
            width: 200px;
            opacity: 0.5;
        }
        
        .line2 {
            width: 200px;
            opacity: 0.3;
        }
        
        .url {
            font-size: 16px;
            font-weight: 400;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="decorative-circle circle1"></div>
    <div class="decorative-circle circle2"></div>
    <div class="decorative-circle circle3"></div>
    <div class="decorative-circle circle4"></div>
    
    <div class="content">
        <div class="logo">
            <span class="logo-selen">Selen</span>
            <span class="logo-it">.IT</span>
        </div>
        
        <div class="logo-underline"></div>
        
        <div class="title">Digital Agency</div>
        
        <div class="subtitle">Web Development • UI/UX Design • Branding</div>
        
        <div class="description">We build digital experiences that drive results</div>
        
        <div class="cta-button">
            <span class="cta-text">Get Started</span>
        </div>
        
        <div class="decorative-lines">
            <div class="line line1"></div>
            <div class="line line2"></div>
        </div>
        
        <div class="url">selenit-digital-agency.vercel.app</div>
    </div>
</body>
</html>
